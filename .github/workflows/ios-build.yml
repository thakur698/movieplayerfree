name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App (macOS Runner)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Install CocoaPods
        run: |
          cd apps/mobile/ios
          pod install

      - name: Build iOS App (Runner.app)
        run: |
          cd apps/mobile
          flutter build ios --release --no-codesign

      - name: Package into .IPA (iOS App Package)
        run: |
          mkdir -p apps/mobile/build/ios/ipa/Payload
          cp -r apps/mobile/build/ios/iphoneos/Runner.app apps/mobile/build/ios/ipa/Payload/
          cd apps/mobile/build/ios/ipa
          zip -r CineStream.ipa Payload

      - name: Upload iOS .IPA Package
        uses: actions/upload-artifact@v4
        with:
          name: CineStream-iOS-IPA
          path: apps/mobile/build/ios/ipa/CineStream.ipa
